[package]
name = "edith-sources"
description = "Edith media sources: one request shape and one candidate shape for free stock sites (Pexels, Pixabay, Freesound), with each site's licence read into what it allows. Parsing is plain code; the network client is behind feature `net`"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# The HTTPS clients and downloads (through edith-net). Off in wasm builds.
net = ["edith-net/http", "dep:sha2", "dep:zeroize"]
# Read the sites' API keys from the OS keychain.
keychain = ["net", "edith-net/keychain"]

[dependencies]
edith-net = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { version = "0.10", optional = true }
zeroize = { version = "1", optional = true }

[dev-dependencies]
edith-net = { workspace = true, features = ["http", "testserver", "keychain"] }
