[package]
name = "filmcraft-net"
description = "FilmCraft network foundation: one HTTP client with an Offline switch and a redacted request log, an OS-keychain secret store, and OAuth building blocks (PKCE, loopback redirect receiver)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# The HTTP client (pure-Rust TLS: rustls + RustCrypto, OS certificate verification).
http = ["dep:ureq", "dep:rustls", "dep:rustls-rustcrypto", "dep:sha2", "dep:serde_json"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true, optional = true }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"], optional = true }
rustls = { version = "0.23", default-features = false, optional = true }
rustls-rustcrypto = { version = "0.0.2-alpha", optional = true }
sha2 = { version = "0.10", optional = true }
