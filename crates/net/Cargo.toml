[package]
name = "filmcraft-net"
description = "FilmCraft network foundation: one HTTP client with an Offline switch and a redacted request log, an OS-keychain secret store, and OAuth building blocks (PKCE, loopback redirect receiver)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# The HTTP client (pure-Rust TLS: rustls + RustCrypto, OS certificate verification).
# The OS keychain (macOS Keychain, Windows Credential Manager, Linux Secret Service over D-Bus
# in pure Rust: no libdbus, no OpenSSL).
keychain = ["dep:keyring-core", "dep:zeroize", "dep:apple-native-keyring-store", "dep:windows-native-keyring-store", "dep:zbus-secret-service-keyring-store"]
http = ["dep:ureq", "dep:rustls", "dep:rustls-rustcrypto", "dep:sha2", "dep:serde_json"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true, optional = true }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"], optional = true }
rustls = { version = "0.23", default-features = false, optional = true }
rustls-rustcrypto = { version = "0.0.2-alpha", optional = true }
sha2 = { version = "0.10", optional = true }
keyring-core = { version = "1", optional = true }
zeroize = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"], optional = true }
